paris-gare-est-nord:
  city: paris
  area_name: "Gare de l’Est / Gare du Nord"
  display_name: "住 Gare de l’Est / Gare du Nord"
  best_for:
    - "想去普罗万、布兰迪堡、圣卢德诺"
    - "需要衔接欧洲之星、北站或东站火车"
    - "预算敏感，但仍想交通方便"
  description: "适合去普罗万、中世纪小镇和巴黎东部路线。这里酒店选择多，但要认真看街区和评价，别只按最低价排序。"
  caution: "这一区域便利，但街区感受差异明显。带老人孩子或晚归较多时，要优先看位置和评价。"
